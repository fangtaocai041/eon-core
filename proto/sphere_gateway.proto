syntax = "proto3";

package taiji.sphere;

import "proto/event_bus.proto";
import "google/protobuf/struct.proto";

service SphereGateway {
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc StreamQuery(QueryRequest) returns (stream QueryProgress);
  rpc Health(taiji.event_bus.Empty) returns (SphereHealth);
}

message QueryRequest {
  string query = 1;
  string protocol = 2;
  string client_id = 3;
  string trace_id = 4;
  map<string, string> metadata = 5;
}

message QueryResponse {
  string trace_id = 1;
  google.protobuf.Struct result = 2;
  float confidence = 3;
  string realm_of_processor = 4;
  int64 processing_time_ms = 5;
  repeated string route_path = 6;
}

message QueryProgress {
  string phase = 1;
  string status = 2;
  float progress_pct = 3;
  string current_vertex = 4;
}

message SphereHealth {
  string status = 1;
  float uptime_seconds = 2;
  map<string, int32> realm_distribution = 3;
  float tetrahedron_spectral_gap = 4;
  int32 active_tendrils = 5;
  map<string, string> vertex_status = 6;
}
