# config/tendrils_registry.yaml — 触须探针注册表
# =================================================
# 12 external probes managed by TendrilManager.
# Each tendril has a target source, protocol, parent vertex,
# and health parameters.

tendrils:
  - id: "tendril_google_scholar"
    target: "Google Scholar"
    url: "https://scholar.google.com"
    protocol: "Scraping"
    vertex: "V0"
    trigram: "qian"
    rate_limit: { capacity: 10, refill_rate: 2 }
    cache_ttl_s: 3600
