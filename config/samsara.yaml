# config/samsara.yaml — 六道轮回配置
# =====================================
# Realm thresholds, karma scoring rules, reincarnation protocol
# parameters, and nirvana conditions.
# Evaluated every 60 seconds by SamsaraRing.run_karma_cycle().

karma_scoring:
  good_deeds:
    - type: "HIGH_RECALL"
      condition: "recall >= 0.98"
      base_score: +3
      half_life_cycles: 5
    - type: "HIGH_PRECISION"
      condition: "precision >= 0.95"
      base_score: +2
      half_life_cycles: 5
    - type: "LOW_LATENCY"
      condition: "latency_p99_ms < 500"
      base_score: +1
      half_life_cycles: 3
    - type: "USER_SATISFACTION"
      condition: "user_rating >= 4.5"
      base_score: +5
      half_life_cycles: 8
    - type: "NOVEL_DISCOVERY"
      condition: "cache_hit == false AND result.is_novel"
      base_score: +4
      half_life_cycles: 3
    - type: "SUCCESSFUL_COLLABORATION"
      condition: "cross_vertex_request_success"
      base_score: +3
      half_life_cycles: 3
  bad_deeds:
    - type: "HALLUCINATION"
      condition: "hallucination_rate > 0.10"
      base_score: -5
      score_multiplier: "hallucination_rate"
      cooldown_cycles: 3
    - type: "TIMEOUT"
      condition: "request_timed_out"
      base_score: -3
      cooldown_cycles: 2
    - type: "CONTRADICTION_LOST"
      condition: "self_claim_proven_wrong"
      base_score: -4
      cooldown_cycles: 0
    - type: "RATE_LIMIT_HIT"
      condition: "rate_limiter_triggered"
      base_score: -2
      cooldown_cycles: 1
    - type: "RESOURCE_WASTE"
      condition: "tokens_used > budget * 1.5 AND quality_score < 0.5"
      base_score: -3
      cooldown_cycles: 3
    - type: "STALE_RESPONSE"
      condition: "cache_age_seconds > config.cache_ttl * 2"
      base_score: -1
      cooldown_cycles: 1

decay:
  function: "karma_weight(t) = initial_score * 0.5 ^ (t / half_life_cycles)"
  decay_check_interval_cycles: 1

reincarnation:
  atomic: true
  rollback_on_failure: true
  cooldown_after_s: 10
  steps:
    - { seq: 1, name: "FREEZE",  action: "pause_request_queue; state=REINCARNATING" }
    - { seq: 2, name: "SNAPSHOT", action: "save_state_to_pickle" }
    - { seq: 3, name: "ADJUST",  action: "apply_new_resource_limits" }
    - { seq: 4, name: "CLEANSE", action: "clear_temp_cache; cancel_in_flight; reset_context" }
    - { seq: 5, name: "REBIRTH", action: "set_karma_score; set_current_realm" }
    - { seq: 6, name: "RECORD",  action: "log_reincarnation_event; emit_prometheus_counter" }
    - { seq: 7, name: "RESUME",  action: "state=RUNNING; resume_request_queue" }

nirvana:
  conditions:
    - "current_realm == DEVA"
    - "consecutive_deva_cycles >= 3"
    - "lifetime_karma >= 200"
    - "bad_deeds.empty() == true"
  upon_nirvana:
    state: "NIRVANA"
    mode: "READONLY_ORACLE"
    knowledge_graph_frozen: true
  duties:
    - "mentor_other_agents"
    - "emit_wisdom_report_every_30_cycles"
  reverse_condition: "oracle_advice_rejected_by_court >= 3"

fairness:
  max_deva_fraction: 0.25
  enforcement: "enforce_demotion_to_human_for_longest_stay"
