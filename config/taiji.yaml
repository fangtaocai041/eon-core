# config/taiji.yaml — TaijiTetrahedron-Samsara v7.4
# ==============================================================
# Single Source of Truth for the 10-layer concentric architecture.
# All runtime components read from this file at bootstrap.

system:
  name: "SanShengWanWu"
  version: "v7.4.0"
  architecture: "sealed_set(3): TriangleCore | open_set(N): DerivedProjects"
  core: "IProjectAdapter -> YinYang -> TriangleCore[fish+cognitive+eon-core]"
  schema_version: "v7.4"
  log_level: "INFO"

origin_kernel:
  bootstrap_timeout_s: 120
  health_pulse_interval_s: 5
  event_bus_capacity: 10000
  dead_letter_queue_capacity: 1000

tetrahedron:
  edges:
    # DAG topology (strictly acyclic)
    # origin->V0/V1/V2/V3/V4 auto-added by bootstrap
    - { from: "V0", to: "V1", weight: 0.9, pathway: "P1", name: "fish->cognitive", direction: "UNIDIRECTIONAL" }
    - { from: "V1", to: "V2", weight: 0.6, pathway: "P3", name: "cognitive->P1(porpoise)", direction: "UNIDIRECTIONAL" }
    - { from: "V1", to: "V3", weight: 0.5, pathway: "P3", name: "cognitive->P2(coilia)", direction: "UNIDIRECTIONAL" }
    - { from: "V1", to: "V4", weight: 0.4, pathway: "P3", name: "cognitive->P3(culter)", direction: "UNIDIRECTIONAL" }
  baseline_spectral_gap: 0.15
  chaos_disturb_interval: 100
  chaos_factor: 0.02

vertices:
  V0:
    id: "V0"
    name: "SupplyVertex"
    stv_role: "S (State)"
    project: "fish-ecology-assistant"
    core_function: "lookup_species(name) -> SpeciesProfile"
    symbol: "TaiYang"
    coordinates: [1.0, 1.0, 1.0]
    pathways: ["P1(fish->cognitive)", "P2(cognitive->fish)"]
    polarity: "YANG_PRIMARY"
    trigrams: ["qian_meta_search", "dui_chinese_gateway"]
    d_level: 2
  V1:
    id: "V1"
    name: "VerifyVertex"
    stv_role: "V (Validation)"
    project: "cognitive-search-engine"
    core_function: "search_species(genus, species) -> SearchResult"
    symbol: "TaiYin"
    coordinates: [1.0, -1.0, -1.0]
    pathways: ["P1(fish->cognitive)", "P2(cognitive->fish)", "P3(cognitive->P1)", "P3(cognitive->P2)", "P3(cognitive->P3)"]
    polarity: "YIN_PRIMARY"
    trigrams: ["li_graph_traversal", "zhen_debate"]
    d_level: 3
  V2:
    id: "V2"
    name: "DomainVertexP1"
    stv_role: "P1(Porpoise)"
    project: "porpoise-agent"
    core_function: "analyze_contradiction(question) -> Route"
    symbol: "ShaoYin"
    coordinates: [-1.0, 1.0, -1.0]
    pathways: ["P3(cognitive->P1)"]
    note: "Derived species template (replicable as Pn)"
    polarity: "YANG_PRIMARY_YIN_SECONDARY"
    trigrams: ["xun_acoustic", "kan_population"]
    d_level: 2
  V3:
    id: "V3"
    name: "DomainVertexP2"
    stv_role: "P2(Coilia)"
    project: "coilia-agent"
    core_function: "assess_species(species, context) -> Assessment"
    symbol: "ShaoYang"
    coordinates: [-1.0, -1.0, 1.0]
    pathways: ["P3(cognitive->P2)"]
    note: "Derived species template (replicable as Pn)"
    polarity: "YIN_PRIMARY_YANG_SECONDARY"
    trigrams: ["gen_otolith", "kun_resource"]
    d_level: 2
  V4:
    id: "V4"
    name: "DomainVertexP3"
    stv_role: "P3(Culter)"
    project: "culter-agent"
    core_function: "assess_culter_species(species, context) -> SpeciesAssessment"
    symbol: "Fire"
    coordinates: [-1.0, 1.0, 1.0]
    pathways: ["P3(cognitive->P3)"]
    note: "Culter domain research (growth/genomics/trophic/resource)"
    polarity: "YIN_PRIMARY_YANG_SECONDARY"
    trigrams: ["zhen_growth", "kun_resource"]
    d_level: 2
