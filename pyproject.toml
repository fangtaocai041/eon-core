[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eon-core"
version = "8.1.1"
description = "三角核心协调器 — EventBus · DAG 路由 · 健康监控 · 6 顶点适配器"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

# === P1/P2 待添加依赖 ===
# redis>=5.0                  # Redis EventBus (P1.3)
# grpcio>=1.60                # gRPC 通信 (P2.2)
# prometheus-client>=0.20     # Prometheus 指标 (P0.3)

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
